name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.8'
  CI: true

jobs:
  format:
    name: format (dart format + analyze)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Restore
        run: flutter pub get

      - name: dart format (verify)
        run: dart format --output=none --set-exit-if-changed .

      - name: flutter analyze
        run: flutter analyze

  build-windows:
    name: build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Restore
        run: flutter pub get

      - name: Build
        run: flutter build windows --release

      - name: Verify artifacts
        shell: pwsh
        run: |
          $expect = @(
            'build/windows/x64/runner/Release/ui.exe'
            'build/windows/x64/runner/Release/flutter_windows.dll'
            'build/windows/x64/runner/Release/data/app.so'
          )
          $missing = $expect | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Error "missing artifacts:`n$($missing -join "`n")"
            exit 1
          }
          $expect | ForEach-Object {
            $size = (Get-Item $_).Length
            Write-Output ("{0,-55} {1,10:N0} bytes" -f $_, $size)
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nyaxis-ui-${{ github.sha }}
          path: build/windows/x64/runner/Release/
          retention-days: 14
