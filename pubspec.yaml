name: ui
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0

  cupertino_icons: ^2.0.0
  window_manager: ^0.5.2
  flutter_svg: ^2.3.0
  flutter_monaco: ^4.0.0
  webview_flutter_windows: ^1.3.0
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  husky: ^0.1.7

flutter:

  uses-material-design: true

  assets:
    - assets/icons/add/
    - assets/icons/checkmark/
    - assets/icons/close/
    - assets/icons/maximize/
    - assets/icons/minimize/
    - assets/icons/restore/
    - assets/icons/sidebar-closed/
    - assets/icons/sidebar-open/
    - assets/keymaps/
    - assets/fonts/
    - assets/luau-lsp/
